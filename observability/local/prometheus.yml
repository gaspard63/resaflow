global:
  scrape_interval: 15s
scrape_configs:
  - job_name: resaflow-api
    static_configs: [{ targets: ["api:8000"], labels: { namespace: local, app_kubernetes_io_component: api } }]
  - job_name: resaflow-worker
    static_configs: [{ targets: ["worker:9100"], labels: { namespace: local, app_kubernetes_io_component: worker } }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { namespace: local } }]
