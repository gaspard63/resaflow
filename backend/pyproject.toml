[project]
name = "resaflow-backend"
version = "1.0.0"
description = "ResaFlow — API de réservation de ressources (salles, matériel)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["B008"]  # Depends() dans les signatures FastAPI

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=75"

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
