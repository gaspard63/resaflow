[alembic]
script_location = alembic
# Rend le paquet "app" importable par env.py quel que soit le chemin de l'exécutable alembic
prepend_sys_path = .
# L'URL vient de DATABASE_URL (voir alembic/env.py) : aucun identifiant dans ce fichier.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
