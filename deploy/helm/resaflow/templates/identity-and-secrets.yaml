{{- /*
ServiceAccount (Workload Identity) + SecretProviderClass (Key Vault) + Secret local de test.
Ce sont des hooks "pre-install,pre-upgrade" de poids négatif : ils doivent exister AVANT le job
de migration (lui-même hook). La politique before-hook-creation les met à jour à chaque release
sans jamais les supprimer pendant que les pods tournent.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "resaflow.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- if .Values.keyVault.enabled }}
    azure.workload.identity/client-id: {{ required "azure.workloadIdentityClientId requis" .Values.azure.workloadIdentityClientId | quote }}
    azure.workload.identity/tenant-id: {{ required "azure.tenantId requis" .Values.azure.tenantId | quote }}
    {{- end }}
# Les pods n'appellent pas l'API Kubernetes : pas de jeton monté (moindre privilège)
automountServiceAccountToken: false
{{- if .Values.keyVault.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: resaflow-kv
  labels:
    {{- include "resaflow.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "keyVault.name requis" .Values.keyVault.name | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
      {{- range $key, $name := .Values.keyVault.secrets }}
        - |
          objectName: {{ printf "%s-%s" $.Values.environment $name }}
          objectType: secret
          objectAlias: {{ $key }}
      {{- end }}
  # Synchronisation vers un Secret Kubernetes consommé en variables d'environnement
  secretObjects:
    - secretName: {{ include "resaflow.secretName" . }}
      type: Opaque
      data:
      {{- range $key, $name := .Values.keyVault.secrets }}
        - objectName: {{ $key }}
          key: {{ $key }}
      {{- end }}
{{- else }}
---
# Cluster local de test uniquement (kind/minikube) : valeurs passées par un fichier NON versionné.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resaflow.secretName" . }}
  labels:
    {{- include "resaflow.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $_ := .Values.keyVault.secrets }}
  {{ $key }}: {{ required (printf "localSecrets.%s requis quand keyVault.enabled=false" $key) (index $.Values.localSecrets $key) | quote }}
  {{- end }}
{{- end }}
