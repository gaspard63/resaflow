# Pré-production (namespace resaflow-staging) : même topologie que la prod, base in-cluster
environment: staging
api:
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70 }
frontend:
  replicas: 2
postgresql:
  enabled: true
  size: 8Gi
backup:
  enabled: true
monitoring:
  dashboards: false
