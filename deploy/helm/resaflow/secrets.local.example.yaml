# Cluster LOCAL de test uniquement (Docker Desktop Kubernetes, kind, minikube) — SANS compte Azure.
# Copier en secrets.local.yaml (ignoré par git), remplacer les "change-me", puis :
#
#   docker compose build                      # construit resaflow-api:local, resaflow-worker:local, resaflow-frontend:local
#   # kind uniquement : kind load docker-image resaflow-api:local resaflow-worker:local resaflow-frontend:local
#   helm upgrade --install resaflow deploy/helm/resaflow -n resaflow-dev --create-namespace `
#     -f deploy/helm/resaflow/values-dev.yaml -f deploy/helm/resaflow/secrets.local.yaml
#   kubectl -n resaflow-dev port-forward svc/resaflow-frontend 8080:80   # puis http://localhost:8080
#
# Différences avec Azure : secrets en Secret Kubernetes (au lieu de Key Vault), Azurite (au lieu de Blob),
# StorageClass par défaut du cluster (au lieu de managed-csi), ni Ingress/TLS, ni NetworkPolicies, ni Prometheus Operator.

image:
  registry: ""          # images locales construites par docker compose
  tag: local
  pullPolicy: IfNotPresent

keyVault:
  enabled: false

azurite:
  enabled: true

postgresql:
  storageClass: ""      # StorageClass par défaut du cluster local

rabbitmq:
  storageClass: ""

ingress:
  enabled: false

networkPolicies:
  enabled: false

monitoring:
  enabled: false

localSecrets:
  POSTGRES_PASSWORD: change-me
  RABBITMQ_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://resaflow:change-me@resaflow-postgresql:5432/resaflow
  CELERY_BROKER_URL: amqp://resaflow:change-me@resaflow-rabbitmq:5672//
  JWT_SECRET: change-me-with-a-long-random-string-of-48-chars
  ADMIN_PASSWORD: change-me-admin
